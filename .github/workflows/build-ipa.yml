# 只出一个包：一次 xcodebuild + 一次打包 + 上传
#
# 之前那版会 build 三次（unsigned / no-pinning / diagnostic）并打多个 IPA，
# 纯测试用没必要，这里精简成一条链路。
#
# 需要完整性清单签名时：在本仓库加 Secret INTEGRITY_ED25519_KEY_PEM，
# 并参考 docs 里的 integrity_pack 用法手动加一步（默认关掉以省时间）。

name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15-intel   # arm64 池排队严重，Intel 池基本秒分配
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Check committed secrets file
        run: |
          set -e
          F=ThreeOneOSFive/Security/Generated/Secrets.generated.swift
          test -f "$F" || { echo "ERROR: $F missing"; exit 1; }
          echo "GeneratedSecrets.ID cases: $(grep -c '^        case ' "$F")"
          for k in host pathHandshake pathConfig pathApps pathLog pathZip pathAlbum pathDeviceOpen infoEnc infoMac infoREnc infoRMac outerKey outerMacKey fileInfo albumInfo; do
            grep -q "case $k = " "$F" || { echo "ERROR: missing $k"; exit 1; }
          done
          shasum -a 256 "$F"

      - name: Verify Swift decryption of generated secrets (macOS)
        run: |
          swiftc -O -o /tmp/swiftcheck \
            ThreeOneOSFive/Security/Generated/Secrets.generated.swift \
            ThreeOneOSFive/Security/SecureBox.swift \
            tools/swiftcheck/main.swift
          /tmp/swiftcheck

      - name: Build .app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="INTEGRITY_DISABLED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Surface compile errors as annotations
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -nE "error:|fatal error:" build.log | head -n 60 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            echo "---- build.log tail ----"
            tail -n 30 build.log
          fi

      - name: Package IPA (single)
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/JSQ.app"
          test -d "$APP" || { echo "ERROR: $APP not found"; exit 1; }
          rm -rf Payload JSQ-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry JSQ-unsigned.ipa Payload
          sz=$(stat -f%z JSQ-unsigned.ipa)
          echo "JSQ-unsigned.ipa: $sz bytes"
          [ "$sz" -gt 100000 ] || { echo "ERROR: ipa too small ($sz)"; exit 1; }
          unzip -l JSQ-unsigned.ipa | grep -q 'Payload/JSQ.app/JSQ' || { echo "ERROR: main executable missing"; exit 1; }
          unzip -l JSQ-unsigned.ipa | grep -q 'Payload/JSQ.app/Info.plist' || { echo "ERROR: Info.plist missing"; exit 1; }

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JSQ-unsigned-ipa
          path: JSQ-unsigned.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7
